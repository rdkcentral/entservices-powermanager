name: L1/L2 Test Monitor

# ─────────────────────────────────────────────────────────────────────────────
# TESTING PHASE:
#   - Triggers every 5 minutes (for quick testing) + manual dispatch
#   - Calls actual L1 and L2 workflows from GDB_Test branch
#   - Branch-locked: only runs on GDB_Test — will error on any other branch
#   - Does NOT modify any existing workflow
#
# FUTURE PHASE — Will be extended to:
#   - Capture pass/fail status, failed job/step, error logs, run URL
#   - Send email notification with a detailed daily report
#   - Run on schedule: daily at 8:00 AM IST (02:30 UTC)
#   - Monitor all RDK repositories (~70 repos)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:  # Manual trigger — click "Run workflow" in Actions UI

  # TESTING: Runs every 5 minutes to quickly validate the pipeline.
  # PRODUCTION: Replace with '30 2 * * *' for daily 8:00 AM IST.
  schedule:
    - cron: '*/5 * * * *'

jobs:
  verify-branch:
    name: Verify Branch (GDB_Test only)
    runs-on: ubuntu-latest

    steps:
      - name: Block execution on non-GDB_Test branches
        # Safety guard: prevents accidental execution on develop or other branches.
        # Remove or update this step when promoting to production.
        if: github.ref_name != 'GDB_Test'
        run: |
          echo "ERROR: This workflow is restricted to GDB_Test branch during testing phase."
          echo "Current branch : ${{ github.ref_name }}"
          echo "Allowed branch : GDB_Test"
          exit 1

      - name: Confirm branch is GDB_Test
        run: |
          echo "================================================"
          echo "  L1/L2 Test Monitor — Triggered Successfully"
          echo "================================================"
          echo "Repository  : ${{ github.repository }}"
          echo "Branch      : ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.triggering_actor }}"
          echo "Trigger     : ${{ github.event_name }}"
          echo "Run ID      : ${{ github.run_id }}"
          echo "Run URL     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "UTC Time    : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "IST Time    : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo "================================================"

  # ─────────────────────────────────────────────────────────────────────────
  # Calls the existing L1-tests.yml from THIS branch (GDB_Test).
  # Uses workflow_call — no modification to L1-tests.yml needed.
  # ─────────────────────────────────────────────────────────────────────────
  L1-tests:
    name: L1 Tests
    needs: verify-branch
    uses: ./.github/workflows/L1-tests.yml
    with:
      caller_source: 'local'
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────
  # Calls the existing L2-tests.yml from THIS branch (GDB_Test).
  # Runs in parallel with L1.
  # ─────────────────────────────────────────────────────────────────────────
  L2-tests:
    name: L2 Tests
    needs: verify-branch
    uses: ./.github/workflows/L2-tests.yml
    with:
      caller_source: 'local'
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────
  # Summarises results after both L1 and L2 complete (pass or fail).
  # ─────────────────────────────────────────────────────────────────────────
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [L1-tests, L2-tests]
    if: always()  # Always runs — even if L1 or L2 failed

    steps:
      - name: Print summary
        run: |
          echo "================================================"
          echo "  L1/L2 Test Monitor — Run Complete"
          echo "================================================"
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Run URL    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "IST Time   : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo ""
          echo "L1 Result  : ${{ needs.L1-tests.result }}"
          echo "L2 Result  : ${{ needs.L2-tests.result }}"
          echo "================================================"

      # ───────────────────────────────────────────────────────────────────────
      # FUTURE STEP — Send email notification with detailed report
      # ───────────────────────────────────────────────────────────────────────
      # - name: Send Email Report
      #   if: always()
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: smtp.gmail.com
      #     server_port: 465
      #     username: ${{ secrets.MAIL_USERNAME }}
      #     password: ${{ secrets.MAIL_PASSWORD }}
      #     subject: "L1/L2 Daily Report — ${{ github.repository }}"
